<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <style>
      @font-face {
        font-family: 'neon2';
        src: url('../public/fonts/neon2.ttf');
      }
    </style>
    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" floodColor="#009bf5" floodOpacity="1" />
      <feDropShadow dx="0" dy="0" stdDeviation="6" floodColor="#009bf5" floodOpacity="0.5" />
    </filter>
  </defs>

  <rect width="64" height="64" fill="#0a0a0a" rx="8"/>

  <text 
